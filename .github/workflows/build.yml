name: Build & Release APK/AAB

on:
push:
branches:
- main
pull_request:
branches:
- main
workflow_dispatch:

concurrency:
group: android-build-${{ github.ref }}
cancel-in-progress: true

jobs:
build-android:
name: Build Android App
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: 📥 Checkout repository
    uses: actions/checkout@v4

  - name: 🔧 Setup Java 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  - name: 📱 Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  - name: ✅ Flutter doctor
    run: flutter doctor

  - name: 📦 Get Flutter packages
    run: flutter pub get

  - name: 🔍 Analyze Flutter code
    run: flutter analyze || true

  - name: 🧪 Run Flutter tests
    run: flutter test || true

  - name: 🔐 Configure release signing
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    run: |
      set -e

      if [ -z "$KEYSTORE_BASE64" ]; then
        echo "⚠️ KEYSTORE_BASE64 is not configured."
        echo "⚠️ Release APK will use debug signing."
      else
        echo "🔐 Decoding release keystore..."

        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

        if [ ! -s android/app/release.jks ]; then
          echo "❌ ERROR: release.jks was not created correctly."
          exit 1
        fi

        echo "🔎 Checking keystore..."

        keytool -list \
          -keystore android/app/release.jks \
          -storepass "$KEYSTORE_PASSWORD" \
          -alias "$KEY_ALIAS" \
          > /tmp/keystore-check.txt

        echo "✅ Keystore password and alias are valid."

        {
          echo "storePassword=$KEYSTORE_PASSWORD"
          echo "keyPassword=$KEY_PASSWORD"
          echo "keyAlias=$KEY_ALIAS"
          echo "storeFile=release.jks"
        } > android/key.properties

        echo "✅ Release signing configured successfully."
      fi

  - name: 📱 Verify Android configuration
    run: |
      echo "Checking Android compileSdk configuration..."
      grep -n "compileSdk" android/app/build.gradle.kts || true
      grep -n "targetSdk" android/app/build.gradle.kts || true

  - name: 🧹 Flutter clean
    run: flutter clean

  - name: 📦 Get packages again after clean
    run: flutter pub get

  - name: 🏗️ Build APK Release
    run: flutter build apk --release

  - name: 📦 Build AAB Release
    run: flutter build appbundle --release

  - name: 📂 Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: customs-broker-app-release-apk
      path: build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
      retention-days: 30

  - name: 📂 Upload AAB
    uses: actions/upload-artifact@v4
    with:
      name: customs-broker-app-release-aab
      path: build/app/outputs/bundle/release/app-release.aab
      if-no-files-found: error
      retention-days: 30

  - name: 📊 Build summary
    if: success()
    run: |
      echo "## ✅ Build completed successfully" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "**Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
      echo "**Date:** $(date)" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "### APK" >> "$GITHUB_STEP_SUMMARY"
      ls -lh build/app/outputs/flutter-apk/app-release.apk >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "### AAB" >> "$GITHUB_STEP_SUMMARY"
      ls -lh build/app/outputs/bundle/release/app-release.aab >> "$GITHUB_STEP_SUMMARY"

      - name: 📂 Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30


      - name: 📊 Build Summary
        run: |

          echo "## ✅ Build Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date)" >> $GITHUB_STEP_SUMMARY

name: Build and Release APK AAB

on:
push:
branches:
- main
pull_request:
branches:
- main
workflow_dispatch:

jobs:
build-android:
name: Build Android App
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      java-version: "17"
      distribution: "temurin"

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  - name: Flutter Doctor
    run: flutter doctor

  - name: Flutter Pub Get
    run: flutter pub get

  - name: Flutter Analyze
    run: flutter analyze || true

  - name: Flutter Test
    run: flutter test || true

  - name: Configure Release Signing
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    run: |
      if [ -z "$KEYSTORE_BASE64" ]; then
        echo "WARNING: No release keystore configured."
        echo "Using debug signing."
      else
        echo "Decoding release keystore..."

        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

        if [ ! -s android/app/release.jks ]; then
          echo "ERROR: release.jks was not created."
          exit 1
        fi

        echo "Checking keystore..."

        keytool -list \
          -keystore android/app/release.jks \
          -storepass "$KEYSTORE_PASSWORD" \
          -alias "$KEY_ALIAS" \
          > /tmp/keystore-check.txt

        echo "Keystore verification successful."

        echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
        echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
        echo "keyAlias=$KEY_ALIAS" >> android/key.properties
        echo "storeFile=release.jks" >> android/key.properties

        echo "Release signing configured successfully."
      fi

  - name: Clean Flutter
    run: flutter clean

  - name: Flutter Pub Get After Clean
    run: flutter pub get

  - name: Build APK
    run: flutter build apk --release

  - name: Build AAB
    run: flutter build appbundle --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: customs-broker-release-apk
      path: build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
      retention-days: 30

  - name: Upload AAB
    uses: actions/upload-artifact@v4
    with:
      name: customs-broker-release-aab
      path: build/app/outputs/bundle/release/app-release.aab
      if-no-files-found: error
      retention-days: 30

  - name: Build Summary
    if: success()
    run: |
      echo "## Build completed successfully" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
      echo "Date: $(date)" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "APK:" >> "$GITHUB_STEP_SUMMARY"
      ls -lh build/app/outputs/flutter-apk/app-release.apk >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "AAB:" >> "$GITHUB_STEP_SUMMARY"
      ls -lh build/app/outputs/bundle/release/app-release.aab >> "$GITHUB_STEP_SUMMARY"

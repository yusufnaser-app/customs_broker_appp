name: Build & Release APK/AAB

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  build-android:

    name: Build Android App

    runs-on: ubuntu-latest

    timeout-minutes: 45


    steps:


      - name: 📥 Checkout repository
        uses: actions/checkout@v4



      - name: 🔧 Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"



      - name: 📱 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true



      - name: ✅ Flutter Doctor
        run: flutter doctor



      - name: 📦 Get Flutter packages
        run: flutter pub get



      - name: 🧹 Clean Flutter build
        run: flutter clean



      - name: 📦 Get packages again
        run: flutter pub get



      - name: 🔍 Analyze code
        run: flutter analyze || true



      - name: 🧪 Run tests
        run: flutter test || true



      - name: 🔐 Setup Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |

          if [ -z "$KEYSTORE_BASE64" ]; then

            echo "⚠️ No release keystore found. Using debug signing."

          else

            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks


            cat <<EOF > android/key.properties

storePassword=$KEYSTORE_PASSWORD
keyPassword=$KEY_PASSWORD
keyAlias=$KEY_ALIAS
storeFile=release.jks

EOF


            echo "✅ Release signing configured."

          fi



      - name: 🏗️ Build APK Release
        run: flutter build apk --release



      - name: 📦 Build App Bundle
        run: flutter build appbundle --release



      - name: 📂 Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: customs-broker-release-apk

          path: build/app/outputs/flutter-apk/app-release.apk

          retention-days: 30



      - name: 📂 Upload AAB
        uses: actions/upload-artifact@v4

        with:

          name: customs-broker-release-aab

          path: build/app/outputs/bundle/release/app-release.aab

          retention-days: 30



      - name: 📊 Build Summary

        run: |

          echo "## ✅ Build Finished" >> $GITHUB_STEP_SUMMARY

          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY

          echo "**APK:**" >> $GITHUB_STEP_SUMMARY

          ls -lh build/app/outputs/flutter-apk/app-release.apk >> $GITHUB_STEP_SUMMARY || true

          echo "**AAB:**" >> $GITHUB_STEP_SUMMARY

          ls -lh build/app/outputs/bundle/release/app-release.aab >> $GITHUB_STEP_SUMMARY || true

name: customs_broker_app
description: دليل المخلص الجمركي اليمني - منصة احترافية لإدارة مكاتب التخليص الجمركي
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  get_it: ^7.7.0
  injectable: ^2.4.4

  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  intl: ^0.20.2
  uuid: ^4.5.1

  google_fonts: ^8.1.0
  fl_chart: ^0.69.0
  shimmer: ^3.0.0

  pdf: ^3.11.3
  printing: ^5.14.2
  excel: ^4.0.6

  share_plus: ^10.1.4

  # متوافق مع Flutter 3.44
  file_picker: ^8.1.7

  image_picker: ^1.1.2

  shared_preferences: ^2.5.0
  flutter_secure_storage: ^9.2.4

  animated_splash_screen: ^1.3.0
  page_transition: ^2.1.0

  # تم تخفيضه لحل تعارض archive مع excel
  lottie: ^3.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.4.14
  injectable_generator: ^2.6.2


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

name: customs_broker_app
description: دليل المخلص الجمركي اليمني - منصة احترافية لإدارة مكاتب التخليص الجمركي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  injectable: ^2.3.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  intl: ^0.20.2
  uuid: ^4.2.1
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  pdf: ^3.10.7
  printing: ^5.11.1
  excel: ^4.0.2
  share_plus: ^7.2.1
  file_picker: ^6.1.1
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  animated_splash_screen: ^1.3.0
  page_transition: ^2.1.0
  lottie: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    
